<script>
let CTA=Number(new URLSearchParams(location.search).get('c'))||1;
const ADD=Number(new URLSearchParams(location.search).get('add'))||0;
let M={sym:'$',dec:2,wa:'52',mon:'MXN',pen:0.2,base:''},FAV={items:[],hide:[],dir:{},msg:''},CU=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
// Todo en pesos (MXN); el interruptor del tablero (vx_mode / vx_pen) decide si se ve en soles.
const mode=()=>{try{return localStorage.getItem('vx_mode')==='mxn'?'mxn':'pen'}catch(e){return 'pen'}};
const penRate=()=>{try{return Number(localStorage.getItem('vx_pen'))||M.pen||0.2}catch(e){return M.pen||0.2}};
const money=n=>{const v=Number(n||0)*(mode()==='pen'?penRate():1);return (v<0?'-':'')+(mode()==='pen'?'S/ ':'MX$ ')+nf(Math.abs(v),2)};
const view=$('view');
async function api(a,extra={},opt){const p=new URLSearchParams({a,c:CTA,...extra});const r=await fetch('/api/dropi?'+p,opt);const j=await r.json().catch(()=>({error:'Respuesta inválida'}));

  $('np-notes').onchange=e=>{NP.notasOn=e.target.checked;$('np-notes-box').style.display=e.target.checked?'':'none'};
  $('np-fp').onclick=async()=>{let t=String(NP.phone).replace(/\D/g,'');if(t.length<8)return modal('<p class="mut">Escriba primero el teléfono del cliente.</p>');
    try{const r=await api('huella',{tel:t}),x=r.perfil;modal(`<h3>Huella del cliente</h3>${x?`<p>${esc(x.cliente)} · ${esc(x.tel)}</p><div class="k5" style="margin-top:10px">${kpi('Pedidos',x.total)}${kpi('Entregados',x.entregados,'','pos')}${kpi('Devueltos',x.devoluciones,'','neg')}${kpi('Cancelados',x.cancelados)}</div><p style="margin-top:12px">Riesgo: <b class="${x.riesgo==='alto'?'neg':x.riesgo==='medio'?'warn':'pos'}">${esc(x.riesgo)}</b></p>`:'<p class="mut">Este teléfono no tiene historial en el período: cliente nuevo.</p>'}`)}catch(e){modal(`<div class="err">${esc(e.message)}</div>`)}};
  cityDraw();pmodeDraw();npCart();carrDraw();origDraw();npSum();
}

/* ================= ARRANQUE (independiente de Admin Dropi: no lee pedidos ni usa periodos) ================= */
function loadSnd(){SND=null;try{SND=JSON.parse(localStorage.getItem('vx_snd_'+CTA)||'null')}catch(e){}}
function accDraw(){
  const el=$('acc');el.innerHTML=CU.map(c=>`<button type="button" class="${c.n===CTA?'on':''}" data-n="${c.n}" title="${c.conectada?'':'Sin token en Vercel'}">${esc(c.nombre)} <span style="font-size:9px">${c.conectada?'●':'○'}</span></button>`).join('');
  el.onclick=e=>{const b=e.target.closest('[data-n]');if(!b||Number(b.dataset.n)===CTA)return;CTA=Number(b.dataset.n);
    NP=null;DEPS=[];CITIES={};CAR=[];DF=null;DEPS_ERR='';GEO_ERR='';loadSnd();try{history.replaceState(null,'','?c='+CTA)}catch(x){}boot()}}
async function boot(){
  view.innerHTML='<div class="empty">Cargando…</div>';
  try{const cu=await api('cuentas');CU=cu.cuentas;const c=CU.find(x=>x.n===CTA)||CU[0];CTA=c.n;M={...c,pen:cu.pen};$('pais').textContent=c.nombre}catch(e){view.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  accDraw();await nuevo();
  if(ADD&&!boot.done){boot.done=true;npResolveId(ADD)}}
addEventListener('storage',ev=>{if((ev.key==='vx_mode'||ev.key==='vx_pen')&&NP&&!NP.res){carrDraw();npSum();npCart();pmodeDraw()}});
boot();
</script></body></html>
