<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Dropi</title><link rel="stylesheet" href="/theme.css">
<style>
body{padding:14px 16px 40px}header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
header h1{font-size:20px}header small{color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px}
.chart i{flex:1;background:linear-gradient(0deg,var(--g2),var(--g));border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.chart i:hover{opacity:1;filter:brightness(1.2)}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.fav{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
</style></head><body>
<header><h1>Panel Dropi <span id="pais" class="pill"></span></h1><small id="src"></small><span class="sp"></span>
<select id="per"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option><option value="all">Todo</option></select>
<button class="btn" id="ref">Actualizar</button></header>
<div class="tabs" id="tabs"></div><div id="view"><div class="empty">Cargando…</div></div>
<script>
const CTA=Number(new URLSearchParams(location.search).get('c'))||1;
let M={sym:'$',dec:0,wa:'',mon:''},D=null,tab='resumen';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d)=>{let t=Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return M.mon==='COP'?t.replace(/,/g,'.'):t};
const money=n=>(n<0?'-':'')+M.sym+nf(Math.abs(n),M.dec)+(M.mon==='COP'?' COP':'');
const pct=n=>(n||0)+'%';
const waLink=(t,txt)=>'https://wa.me/'+(String(t).startsWith(M.wa)?t:M.wa+t)+(txt?'?text='+encodeURIComponent(txt):'');
const view=document.getElementById('view');
async function api(a,extra={},opt){
  const p=new URLSearchParams({a,c:CTA,d:document.getElementById('per').value,...extra});
  const r=await fetch('/api/dropi?'+p,opt);const j=await r.json().catch(()=>({error:'Respuesta inválida'}));
  if(!r.ok)throw new Error(j.error||r.status);return j;
}
const post=(a,body,extra)=>api(a,extra,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const TABS=[['resumen','Resumen'],['pedidos','Pedidos'],['prov','Proveedores'],['favs','Favoritos'],['gest','Gestión'],['rend','Rendimiento']];
document.getElementById('tabs').innerHTML=TABS.map(([k,v])=>`<button class="btn" data-t="${k}">${v}</button>`).join('');
document.getElementById('tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render();}};
document.getElementById('ref').onclick=()=>load(true);document.getElementById('per').onchange=()=>load();
const bar=v=>`<div class="bar"><i style="width:${Math.min(100,v||0)}%"></i></div>`;
const pill=g=>`<span class="pill ${esc(g)}">${esc(g)}</span>`;
const kpi=(l,v,s,c)=>`<div class="card kpi"><div class="l">${l}</div><div class="v ${c||''}">${v}</div><div class="s">${s||''}</div></div>`;

async function load(fresh){
  view.innerHTML='<div class="empty">Cargando…</div>';
  try{
    const cu=await api('cuentas');const c=cu.cuentas.find(x=>x.n===CTA);M=c;
    document.getElementById('pais').textContent=c.nombre;
    document.getElementById('src').textContent='Fuente: Dropi '+c.pais+' · '+c.mon+' · datos en vivo, sin guardar clientes';
    D=await api('data',fresh?{fresh:1}:{});render();
  }catch(e){view.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}
async function render(){
  document.querySelectorAll('#tabs .btn').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(!D)return;
  try{await ({resumen,pedidos,prov,favs,gest,rend}[tab])();}catch(e){view.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}
function resumen(){
  const k=D.kpis;
  view.innerHTML=`<div class="grid">
   ${kpi('Pedidos',k.total,k.proceso+' en proceso')}${kpi('Ventas',money(k.ventas),'sin cancelados')}
   ${kpi('Entregados',k.entregados,pct(k.efectividad)+' efectividad','pos')}${kpi('Devoluciones',k.devueltos,'pérdida '+money(k.perdidaDev),'neg')}
   ${kpi('Por cobrar',money(k.porCobrar),'en proceso y novedad','warn')}${kpi('Utilidad',money(k.utilidad),'total − costo − flete',k.utilidad>=0?'pos':'neg')}
   ${kpi('Novedades',k.novedad,'requieren gestión','warn')}${kpi('Días promedio',k.diasPromedio,'a entregar')}</div>
  <div class="cols"><div class="card"><h3>Tendencia diaria (pedidos)</h3><div class="chart">${trend()}</div></div>
  <div class="card"><h3>Transportadoras</h3><table class="tbl"><tr><th>Nombre</th><th>Total</th><th>Efectividad</th><th></th></tr>
   ${D.transportadoras.map(t=>`<tr><td>${esc(t.nombre)}</td><td>${t.total}</td><td>${pct(t.efectividad)}</td><td>${bar(t.efectividad)}</td></tr>`).join('')||'<tr><td colspan=4 class=empty>Sin datos</td></tr>'}</table></div>
  <div class="card"><h3>Zonas (departamento)</h3><table class="tbl"><tr><th>Zona</th><th>Total</th><th>Efectividad</th><th></th></tr>
   ${D.zonas.slice(0,8).map(t=>`<tr><td>${esc(t.nombre)}</td><td>${t.total}</td><td>${pct(t.efectividad)}</td><td>${bar(t.efectividad)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>Productos</h3><table class="tbl"><tr><th>Producto</th><th>Pedidos</th><th>Efect.</th><th>Utilidad</th></tr>
   ${D.productos.slice(0,8).map(t=>`<tr><td>${esc(t.nombre)}</td><td>${t.total}</td><td>${pct(t.efectividad)}</td><td class="${t.utilidad>=0?'pos':'neg'}">${money(t.utilidad)}</td></tr>`).join('')}</table></div></div>`;
}
function trend(){const t=D.tendencia,mx=Math.max(1,...t.map(x=>x.pedidos));return t.map(x=>`<i title="${esc(x.fecha)}: ${x.pedidos} pedidos" style="height:${x.pedidos/mx*100}%"></i>`).join('')||'<span class="mut">Sin datos</span>';}
function pedidos(){
  view.innerHTML=`<div class="row" style="margin-bottom:10px"><input id="q" placeholder="Buscar cliente, teléfono, guía, producto…" size="34">
  <select id="gf"><option value="">Todos</option><option>entregado</option><option>devolucion</option><option>cancelado</option><option>novedad</option><option>proceso</option></select><span class="mut" id="cnt"></span></div>
  <div class="card scroll"><table class="tbl"><thead><tr><th>ID</th><th>Fecha</th><th>Estado</th><th>Cliente</th><th>Ciudad</th><th>Transportadora</th><th>Producto</th><th>Total</th><th>Utilidad</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const f=()=>{const q=document.getElementById('q').value.toLowerCase(),g=document.getElementById('gf').value;
    const r=D.pedidos.filter(p=>(!g||p.grupo===g)&&(!q||[p.cliente,p.tel,p.guia,p.prod,p.ciudad,String(p.id)].join(' ').toLowerCase().includes(q)));
    document.getElementById('cnt').textContent=r.length+' pedidos';
    document.getElementById('tb').innerHTML=r.slice(0,300).map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.fecha)}</td><td>${pill(p.grupo)} <span class="mut">${esc(p.estado)}</span></td><td>${esc(p.cliente)}</td><td>${esc(p.ciudad)}, ${esc(p.depto)}</td><td>${esc(p.transp)}</td><td>${esc(p.prod)}</td><td>${money(p.total)}</td><td class="${p.utilidad>=0?'pos':'neg'}">${money(p.utilidad)}</td><td>${p.tel?`<a target="_blank" rel="noopener" href="${esc(waLink(p.tel))}">WhatsApp</a>`:''}</td></tr>`).join('');};
  document.getElementById('q').oninput=f;document.getElementById('gf').onchange=f;f();
}
async function prov(){
  const r=await api('prov');
  view.innerHTML=`<div class="card scroll"><table class="tbl"><tr><th>Proveedor</th><th>Pedidos</th><th>Entregados</th><th>Devol.</th><th>Efectividad</th><th></th><th>Ventas</th><th>Costo</th></tr>
  ${r.proveedores.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${p.total}</td><td>${p.entregados}</td><td>${p.devoluciones}</td><td>${pct(p.efectividad)}</td><td>${bar(p.efectividad)}</td><td>${money(p.ventas)}</td><td>${money(p.costo)}</td></tr>`).join('')||'<tr><td colspan=8 class=empty>Sin datos</td></tr>'}</table></div>`;
}
async function favs(){
  const r=await api('favs');
  view.innerHTML=`<div class="row" style="margin-bottom:10px"><input id="fq" placeholder="Buscar en catálogo Dropi…" size="30"><button class="btn pri" id="fb">Buscar</button></div>
  <div class="cols"><div class="card"><h3>Resultados</h3><div id="res" class="mut">Escriba un producto y busque.</div></div>
  <div class="card"><h3>Favoritos (${r.favs.length})</h3><div id="fl">${r.favs.map(f=>favRow(f,'del')).join('')||'<div class="empty">Sin favoritos</div>'}</div></div></div>`;
  const wire=()=>view.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{await post('favs',{op:b.dataset.op,item:JSON.parse(b.dataset.it)});favs();});
  wire();
  document.getElementById('fb').onclick=async()=>{const q=document.getElementById('fq').value.trim();if(!q)return;
    const x=await api('favs',{q});document.getElementById('res').innerHTML=x.resultados.map(f=>favRow(f,'add')).join('')||'Sin resultados';wire();};
}
const favRow=(f,op)=>`<div class="fav"><div>${esc(f.name)}<div class="mut">${money(f.price)}</div></div><button class="btn" data-op="${op}" data-it="${esc(JSON.stringify({id:f.id,name:f.name,price:f.price,img:f.img||''}))}">${op==='add'?'★ Agregar':'Quitar'}</button></div>`;
async function gest(){
  const r=await api('gest');
  view.innerHTML=`<div class="card scroll"><table class="tbl"><tr><th>Pedido</th><th>Estado</th><th>Cliente</th><th>Último movimiento</th><th>Gestión</th><th>Nota</th><th></th></tr>
  ${r.items.map(p=>{const n=r.notas[p.id]||{};return`<tr><td>${esc(p.id)}<div class="mut">${esc(p.guia)}</div></td><td>${pill(p.grupo)} <span class="mut">${esc(p.estado)}</span></td><td>${esc(p.cliente)}${p.tel?` <a target="_blank" rel="noopener" href="${esc(waLink(p.tel,'Hola, le escribimos por su pedido '+p.id))}">WA</a>`:''}</td><td class="mut">${esc(p.mov)}</td>
  <td><select data-s="${esc(p.id)}">${['pendiente','contactado','reagendado','resuelto'].map(o=>`<option ${n.estado===o?'selected':''}>${o}</option>`).join('')}</select></td>
  <td><input data-n="${esc(p.id)}" value="${esc(n.nota||'')}" size="22" maxlength="300"></td><td><button class="btn" data-g="${esc(p.id)}">Guardar</button></td></tr>`}).join('')||'<tr><td colspan=7 class=empty>Nada por gestionar</td></tr>'}</table></div>`;
  view.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{const id=b.dataset.g;
    await post('gest',{id,estado:view.querySelector(`[data-s="${id}"]`).value,nota:view.querySelector(`[data-n="${id}"]`).value});b.textContent='✓ Guardado';});
}
async function rend(){
  const r=await api('huella'),t=D.transportadoras;
  view.innerHTML=`<div class="cols"><div class="card"><h3>Ranking de transportadoras</h3><table class="tbl"><tr><th>Nombre</th><th>Entregados</th><th>Devol.</th><th>Efect.</th><th>Días</th><th>Utilidad</th></tr>
  ${[...t].sort((a,b)=>b.efectividad-a.efectividad).map(x=>`<tr><td>${esc(x.nombre)}</td><td>${x.entregados}</td><td>${x.devoluciones}</td><td>${pct(x.efectividad)}</td><td>${x.dias}</td><td class="${x.utilidad>=0?'pos':'neg'}">${money(x.utilidad)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>Ventas por día</h3><div class="chart">${(()=>{const d=D.tendencia,m=Math.max(1,...d.map(x=>x.ventas));return d.map(x=>`<i title="${esc(x.fecha)}: ${esc(money(x.ventas))}" style="height:${x.ventas/m*100}%"></i>`).join('')})()}</div></div></div>
  <div class="card" style="margin-top:12px"><h3>Huella del cliente (riesgo por teléfono)</h3><div class="scroll"><table class="tbl"><tr><th>Teléfono</th><th>Cliente</th><th>Pedidos</th><th>Entreg.</th><th>Devol.</th><th>Cancel.</th><th>Riesgo</th></tr>
  ${r.clientes.map(c=>`<tr><td>${esc(c.tel)}</td><td>${esc(c.cliente)}</td><td>${c.total}</td><td>${c.entregados}</td><td>${c.devoluciones}</td><td>${c.cancelados}</td><td class="${c.riesgo==='alto'?'neg':c.riesgo==='medio'?'warn':'pos'}">${esc(c.riesgo)}</td></tr>`).join('')||'<tr><td colspan=7 class=empty>Sin clientes de riesgo</td></tr>'}</table></div></div>`;
}
load();
</script></body></html>
