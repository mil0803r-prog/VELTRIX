<script>(function(){function a(){try{document.documentElement.dataset.theme=localStorage.getItem('vx_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}}a();addEventListener('storage',a)})()</script>
<link rel="preload" as="font" type="font/woff2" href="/inter.woff2" crossorigin>
<link rel="stylesheet" href="/theme.css">
<style>
:root{--blue:#0369a1;--grey:#94a3a0}:root[data-theme=dark]{--blue:#38bdf8}
body{padding:16px 18px 40px;height:auto;background-attachment:scroll}
header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}header h1{font-size:21px;font-weight:650;letter-spacing:-.02em}header small{color:var(--mut)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:sticky;top:6px;z-index:5;backdrop-filter:blur(12px)}
.tabs button{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--mut);font:inherit;font-weight:500;padding:9px 15px;border-radius:10px;cursor:pointer;transition:.25s var(--ease)}
.tabs button:hover{color:var(--text);background:var(--card2)}.tabs button.on{background:linear-gradient(135deg,var(--g2),var(--g) 60%,var(--gl));color:#fff;font-weight:600;box-shadow:0 8px 18px -8px rgba(4,120,87,.7)}
#view>*{animation:fadein .35s both}
.vopts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.vopt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--solid);color:var(--text);border-radius:99px;padding:5px 12px 5px 7px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:.2s}
.vopt:hover:not(:disabled){border-color:var(--gl)}.vopt.on{border-color:var(--g);background:var(--gsoft);font-weight:600;box-shadow:0 0 0 2px color-mix(in srgb,var(--g) 28%,transparent)}.vopt:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}.vopt small{color:var(--mut);font-weight:400}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex-shrink:0}.sw.sm{width:11px;height:11px;margin-left:3px;vertical-align:-1px}
.fg{display:grid;align-items:start;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.fl{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--mut)}.fl input,.fl select,.fl textarea{width:100%;font-weight:400;color:var(--text)}.req::after{content:" *";color:var(--red)}
.k5{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.v.bl{color:var(--blue)}.v.am{color:var(--amb)}
.sec{margin-top:14px}.sec>h3,.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hd .sp{flex:1}.hd small{color:var(--mut);font-weight:400;font-size:12px}
.attn{border-color:#e9c47a;background:linear-gradient(0deg,rgba(251,191,36,.07),rgba(251,191,36,.07)),var(--card)}
.arow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;margin-bottom:8px;background:var(--solid);border:1px solid var(--line);border-radius:12px}
.arow .nm{font-weight:600}.arow .sb{font-size:12px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.g{background:var(--p-ok);color:var(--p-okt);border-color:transparent}.chip.r{background:var(--p-bad);color:var(--p-badt);border-color:transparent}.chip.a{background:var(--p-nov);color:var(--p-novt);border-color:transparent}.chip.b{background:#e0f2fe;color:#075985;border-color:transparent}
:root[data-theme=dark] .chip.b{background:#0c2a3d;color:#7dd3fc}
.chip.mono{font-family:ui-monospace,Menlo,monospace;font-weight:500}
.ac{display:flex;gap:6px;align-items:center}.ic,.wab{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:10px;border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;transition:.2s}
.ic.t-a{background:var(--p-nov);color:var(--p-novt)}.ic.t-b{background:#e0f2fe;color:#075985}:root[data-theme=dark] .ic.t-b{background:#0c2a3d;color:#7dd3fc}
.ic:hover,.wab:hover{transform:translateY(-1px);filter:brightness(.96)}.ic:disabled{opacity:.4;cursor:not-allowed;transform:none}
.wab{background:var(--p-ok);color:var(--p-okt);text-decoration:none;padding:0 10px;gap:5px;grid-auto-flow:column}.wab.off{opacity:.55;cursor:default}
.twocol{display:grid;gap:14px;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);margin-top:14px}
.sem{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--solid);margin-bottom:10px}
.sem .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}.sem .nm{font-weight:700}.sem .pc{margin-left:auto;font-weight:700;font-size:18px}
.dt{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}
.g{color:var(--gl)}.r{color:var(--red)}.a{color:var(--amb)}
.stack{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--gsoft)}.stack i{display:block;height:100%;animation:grow .9s var(--ease) both}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--mut)}.stats b{color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.donut{display:grid;place-items:center;padding:6px 0 14px}.donut svg{width:190px;height:190px;transform:rotate(-90deg)}.donut circle{fill:none;stroke-width:24;animation:dash 1.1s var(--ease) both}
@keyframes dash{from{stroke-dasharray:0 var(--C)}}
.erow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}.erow .n{margin-left:auto;font-weight:700}.erow .p{width:48px;text-align:right;color:var(--mut);font-size:12px}
.combo{width:100%;height:auto}.combo text{font-size:11px;fill:var(--mut)}.combo .grid line{stroke:var(--line)}
.combo .cb{fill:var(--g);opacity:.9;transform-origin:center bottom;transform-box:fill-box;animation:up .8s var(--ease) both}.combo .cb:hover{opacity:1;fill:var(--gl)}
.combo .ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 2s var(--ease) .3s forwards}
.combo .pt{fill:var(--solid);stroke:var(--blue);stroke-width:2}
.dept{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:18px}.dept>div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.dept b{font-size:11px;margin-bottom:3px}.dept i{width:100%;max-width:60px;background:linear-gradient(0deg,var(--g2),var(--gl));border-radius:6px 6px 0 0;animation:up .8s var(--ease) both;transform-origin:bottom}.dept span{font-size:9.5px;color:var(--mut);text-align:center;margin-top:6px;line-height:1.15;word-break:break-word;height:24px;overflow:hidden}
.top8 .r8{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}.r8 .rk{width:18px;color:var(--mut);font-size:12px}.r8 .nm{flex:1;min-width:0}.r8 .u{font-weight:700;font-size:16px}.r8 .pd{color:var(--mut);font-size:11px;width:54px;text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}.pc2{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:var(--solid);cursor:pointer;transition:.2s;font-size:12px}.pc2:hover,.pc2.on{border-color:var(--gl);background:var(--gsoft)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}.btn.wa{background:var(--p-ok);color:var(--p-okt);border-color:transparent;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}.filters input[type=text],.filters input:not([type]){flex:1;min-width:200px}
tr.hot td{background:rgba(190,18,60,.07)}tr.hot:hover td{background:rgba(190,18,60,.12)}
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin:18px 0 4px}
.sevs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.sev{border-left:4px solid var(--c);border-radius:14px}.sev .big{font-size:26px;font-weight:700;color:var(--c)}
.ofgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 290px;align-items:start}.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}.kv b{font-size:15px}
.fchip{border:1px solid var(--line);background:var(--solid);color:var(--mut);border-radius:99px;padding:5px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}.fchip:hover{border-color:var(--gl)}.fchip.on{background:var(--g);color:#fff;border-color:transparent}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--solid);margin-bottom:8px}.frow .nm{font-weight:600}.frow .sb{font-size:12px;color:var(--mut)}.frow input{width:190px}
.gl{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--mut);margin:14px 0 6px}
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px;animation:fadein .2s}.mb{background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(480px,100%);max-height:80vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:rise .3s var(--ease)}
.mb .btn{margin-top:14px;width:100%}.tl{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:16px}.tl div{position:relative;padding:4px 0}.tl div::before{content:"";position:absolute;left:-22px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--gl);box-shadow:0 0 0 3px var(--gsoft)}
@media(max-width:1000px){.twocol,.ofgrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Panel Dropi <span id="pais" class="pill"></span></h1><small id="src"></small><span class="sp"></span>
<select id="per"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option><option value="all">Todo</option></select>
<button class="btn" id="ref">Actualizar</button></header>
<div class="tabs" id="tabs"></div><div id="view"><div class="empty">Cargando…</div></div>
<script>
const CTA=Number(new URLSearchParams(location.search).get('c'))||1,RET=5;
let M={sym:'$',dec:2,wa:'',mon:'MXN',pen:0.2,base:''},D=null,tab=(['resumen','ofi','prov','nov','rend','pagos','nuevo'].includes(new URLSearchParams(location.search).get('t'))?new URLSearchParams(location.search).get('t'):'resumen'),FAV={items:[],hide:[],dir:{},msg:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
// Trabaja en pesos (MXN); se muestra en soles (PEN) o pesos segun el interruptor del tablero (localStorage vx_mode / vx_pen).
const mode=()=>{try{return localStorage.getItem('vx_mode')==='mxn'?'mxn':'pen'}catch(e){return 'pen'}};
const penRate=()=>{try{return Number(localStorage.getItem('vx_pen'))||M.pen||0.2}catch(e){return M.pen||0.2}};
const rate=()=>mode()==='pen'?penRate():1;
const money=n=>{const v=Number(n||0)*rate();return (v<0?'-':'')+(mode()==='pen'?'S/ ':'MX$ ')+nf(Math.abs(v),2)};
const pct=n=>(n||0)+'%';
const waLink=(t,txt)=>'https://wa.me/'+(String(t).startsWith(M.wa)?t:M.wa+t)+(txt?'?text='+encodeURIComponent(txt):'');
const view=$('view');
async function api(a,extra={},opt){const p=new URLSearchParams({a,c:CTA,d:$('per').value,...extra});const r=await fetch('/api/dropi?'+p,opt);const j=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok){const er=new Error(j.error||r.status);er.data=j;er.status=r.status;throw er}return j}
const post=(a,body,extra)=>api(a,extra,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const IC={chart:'<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',building:'<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',trend:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',finger:'<path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88M17.29 21.02c.12-.6.43-2.3.5-3.02M2 12a10 10 0 0 1 18-6M2 16h.01M21.8 16c.2-2 .131-5.354 0-6M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2M8.65 22c.21-.66.45-1.32.57-2M9 6.8a6 6 0 0 1 9 5.2v2"/>',wa:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',pencil:'<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5Z"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',plus:'<path d="M5 12h14M12 5v14"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const TABS=[['resumen','Resumen','chart'],['ofi','Oficina','building'],['prov','Proveedores','truck'],['nov','Novedades','bell'],['rend','Rendimiento','trend'],['pagos','Pagos','wallet'],['nuevo','Subir pedido','plus']];
$('tabs').innerHTML=TABS.map(([k,v,i])=>`<button data-t="${k}">${I(i)}${v}</button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render()}};
$('ref').onclick=()=>load(true);$('per').onchange=()=>load();
const GRC={entregado:'var(--gl)',proceso:'var(--blue)',novedad:'var(--amb)',devolucion:'var(--red)',cancelado:'var(--grey)'};
const bar=v=>`<div class="bar"><i style="width:${Math.min(100,v||0)}%"></i></div>`;
let OVR={};
const nrm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
// Naranja = pendiente · Azul = en ruta · Negro = en inventario · Morado = oficina · Amarillo = novedad · Rosa = devolucion en transito · Rojo = devolucion · Verde = entregado · Gris = cancelado
const AUTO=(e,g)=>{const s=nrm(e);
  if(/ENTREGADO A TRANSPORTADORA|ENTREGADA A CONEXIONES/.test(s))return 'e-ruta';
  if(/CANCEL|ANULAD|GUIA NO EXISTE/.test(s))return 'e-can';
  if(/DEVOL.*(TRANS|CAMINO|RUTA)|PROCESO DE DEVOL|PARA DEVOLVER|EN DEVOLUCION/.test(s))return 'e-devt';
  if(/DEVOL|DEVUELT|RECHAZ|REMITENTE|NO ENTREGADO|REZAGO|INDEMNIZ|SINIESTRO|INCAUTAD|RETENCION|\bDEV\b/.test(s))return 'e-dev';
  if(/SOLUCIONAD/.test(s))return 'e-ruta';
  if(/NOVEDAD|INCIDENC|INTENTO|ORDEN PUBLICO|CIERRE DE VIAS|NO SE CUBRE|MAL ZONIFICADO|CLIMATOLOG|NO HAY QUIEN|FISICO NO|NO LLEGO|INVESTIGACION|STAND BY|ERROR/.test(s))return 'e-nov';
  if(/ENTREGAD[OA]|ENTREGA EXITOSA|ENTREGA VERIFICADA|^ENTREGA( DIGITALIZADA)?$|DESPACHO EFECTIVO|PRUEBA DE ENTREGA|CUMPLIDO/.test(s))return 'e-ok';
  if(/ALISTAMIENTO/.test(s))return 'e-pend';
  if(/OFICINA/.test(s))return 'e-ofi';
  if(/INVENTARIO|BODEGA DROPI|RECIBIDO (POR )?(DROPI|PAU)|RECOGIDO POR DROPI|BODEGA ORIGEN/.test(s))return 'e-inv';
  if(/PENDIENTE|GENERANDO|GENERAD|PREPARAD|CONFIRMACION|TELEMERCADEO|AGENDAD|^EN PROCESO$/.test(s))return 'e-pend';
  if(/RUTA|TRANSITO|CAMINO|REPARTO|DISTRIBUCION|DESPACH|RECOLEC|RECOGID|TRANSPORT|TERMINAL|TRASLADO|BODEGA|ADMITID|CENTRO|ZONA|ASIGNAD|CARGAD|REEXPED|REDIRECC|VIAJANDO|REENVIO|ACOPIO|SALIO|INGRESO|DIGITAD/.test(s))return 'e-ruta';
  return g==='entregado'?'e-ok':g==='devolucion'?'e-dev':g==='cancelado'?'e-can':g==='novedad'?'e-nov':'e-pend'};
const estCls=(e,g)=>OVR[nrm(e)]||AUTO(e,g);
const estPill=(e,g)=>`<span class="es ${estCls(e,g)}">${esc(e)}</span>`;
const ECOL={'e-ok':'var(--c-ok)','e-ruta':'var(--c-ruta)','e-pend':'var(--c-pend)','e-inv':'var(--c-inv)','e-ofi':'var(--c-ofi)','e-nov':'var(--c-nov)','e-devt':'var(--c-devt)','e-dev':'var(--c-dev)','e-can':'var(--c-can)'};
const ESTADOS=[['e-pend','Pendiente / guía'],['e-ruta','En ruta / tránsito'],['e-inv','En inventario'],['e-ofi','En oficina'],['e-nov','Novedad'],['e-devt','Devolución en tránsito'],['e-dev','Devolución / rechazado'],['e-ok','Entregado'],['e-can','Cancelado']];
const pill=g=>`<span class="pill ${esc(g)}">${esc(g)}</span>`;
const kpi=(l,v,s,c)=>`<div class="card kpi"><div class="l">${l}</div><div class="v ${c||''}">${v}</div><div class="s">${s||''}</div></div>`;
const foot=(ms,cache)=>{const d=new Date(cache||Date.now());return `<div class="foot">Fuente: ${esc(M.base)}/integrations · Actualizado ${d.toLocaleDateString('es')}, ${d.toLocaleTimeString('es')} · ${ms??0} ms</div>`};
const mdate=()=>new Date().toISOString().slice(0,10);
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mb">${h}<button class="btn" data-x>Cerrar</button></div>`;m.onclick=e=>{if(e.target===m||e.target.dataset.x!==undefined)m.remove()};document.body.appendChild(m)}
const acts=p=>`<div class="ac"><button class="ic t-a" data-mov="${esc(p.id)}" title="Movimientos de la guía">${I('clock')}</button><button class="ic t-b" data-hue="${esc(p.tel)}" title="Huella del cliente" ${p.tel?'':'disabled'}>${I('finger')}</button>${p.tel?`<a class="wab" target="_blank" rel="noopener" title="Escribir por WhatsApp" href="${esc(waLink(p.tel,'Hola '+(p.cliente||'')+', le escribimos por su pedido '+p.id))}">${I('wa')}</a>`:`<span class="wab off">${I('wa')} Sin número</span>`}</div>`;
view.addEventListener('click',async e=>{
  const m=e.target.closest('[data-mov]'),h=e.target.closest('[data-hue]');
  try{
    if(m){const id=m.dataset.mov,r=await api('rastreo',{q:id}),x=(r.resultados||[]).find(y=>String(y.id)===String(id));

function combo(t){
  if(!t.length)return '<div class="empty">Sin datos</div>';t=t.slice(-60);
  const W=1000,H=290,L=40,Rr=70,T=14,B=30,pw=W-L-Rr,ph=H-T-B,n=t.length,r=rate();
  const nice=v=>{const e=Math.pow(10,Math.floor(Math.log10(v||1))),m=v/e;return(m<=1?1:m<=2?2:m<=5?5:10)*e};
  const mP=Math.max(4,nice(Math.max(...t.map(x=>x.pedidos)))),mR=nice(Math.max(1,...t.map(x=>x.recaudo*r)));
  const sw=pw/n,bw=Math.min(38,sw*.62),X=i=>L+sw*i+sw/2,yP=v=>T+ph-v/mP*ph,yR=v=>T+ph-v/mR*ph;
  let g='',b='',pts=[],lab='';
  for(let i=0;i<=4;i++){const y=T+ph-i*ph/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${nf(mP*i/4,mP<8?1:0)}</text><text x="${W-Rr+8}" y="${y+4}">${nf(mR*i/4,0)}</text>`}
  const st=Math.ceil(n/16);
  t.forEach((x,i)=>{const h=x.pedidos/mP*ph;b+=`<rect class="cb" style="animation-delay:${i*14}ms" x="${X(i)-bw/2}" y="${T+ph-h}" width="${bw}" height="${h}" rx="4"><title>${esc(x.fecha)}: ${x.pedidos} pedidos · ${esc(money(x.recaudo))}</title></rect>`;pts.push([X(i),yR(x.recaudo*r)]);if(i%st===0)lab+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle">${esc(x.fecha.slice(5))}</text>`});
  let d='M'+pts[0].join(',');for(let i=1;i<n;i++){const[a,b2]=pts[i-1],[c,e]=pts[i],m=(a+c)/2;d+=` C${m},${b2} ${m},${e} ${c},${e}`}
  const dots=n<=31?pts.map(p=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3"/>`).join(''):'';
  return `<svg class="combo" viewBox="0 0 ${W} ${H}"><g class="grid">${g}</g>${b}<path class="ln" d="${d}"/>${dots}${lab}</svg><div class="legend" style="justify-content:center"><span><i style="background:var(--g)"></i>Pedidos</span><span><i style="background:var(--blue)"></i>Recaudo (${mode()==='pen'?'S/':'MX$'})</span></div>`}
function donut(est){
  const seg=est.filter(x=>x.n>0),tot=seg.reduce((a,x)=>a+x.n,0)||1,R=70,C=2*Math.PI*R;let acc=0;
  return `<div class="donut"><svg viewBox="0 0 190 190">${seg.map(x=>{const l=x.n/tot*C,o=acc;acc+=l;return `<circle cx="95" cy="95" r="${R}" stroke="${ECOL[estCls(x.estado,x.grupo)]}" stroke-dasharray="${Math.max(l-2,0)} ${C-l+2}" stroke-dashoffset="${-o}" style="--C:${C}"><title>${esc(x.estado)}: ${x.n}</title></circle>`}).join('')}</svg></div>`}

   <label class="row" style="margin-top:12px;align-items:flex-start;gap:8px"><input type="checkbox" id="npok" ${NP.ok?'checked':''} style="margin-top:3px"><span style="font-size:12px">Revisé los datos. Entiendo que esto <b>crea un pedido real en Dropi</b> que se enviará al cliente.</span></label>
   <button class="btn pri" id="npgo" style="width:100%;margin-top:12px;padding:11px" ${e.length||!NP.ok?'disabled':''}>${I('send')} Subir pedido a Dropi</button><div id="nperr"></div>`;
  $('npok').onchange=ev=>{NP.ok=ev.target.checked;npSum()};$('npgo').onclick=()=>npEnviar(false)}
function npCart(){
  const el=$('cart');if(!el)return;
  el.innerHTML=NP.items.map((i,k)=>{const sel=i.variations.find(v=>String(v.id)===String(i.variation_id));
   return `<div class="frow" style="align-items:flex-start"><div style="flex:1;min-width:260px;display:flex;gap:12px">
    ${i.img?`<img src="${esc(i.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:54px;height:54px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex-shrink:0" onerror="this.remove()">`:''}
    <div style="flex:1;min-width:0"><div class="nm">${esc(i.name)}</div><div class="sb">ID ${esc(i.id)}${i.suggested?' · sugerido '+mx(i.suggested):''}${i.manual?' · <span class="warn">no está en el catálogo: se enviará tal cual</span>':''}</div>
    ${i.variations.length?`<div class="vopts">${i.variations.map(v=>{const sw=swatch(v.color||v.label);return `<button type="button" class="vopt ${String(i.variation_id)===String(v.id)?'on':''}" data-vk="${k}" data-vv="${esc(v.id)}" ${v.stock===0?'disabled title="Sin stock"':''}>${sw?`<i class="sw" style="background:${sw}"></i>`:''}${esc(v.label)}${v.stock!=null?`<small>${v.stock===0?'agotado':esc(v.stock)+' und'}</small>`:''}</button>`}).join('')}</div>${sel?'':'<div class="warn" style="font-size:12px;margin-top:6px">Elija la variación (color / modelo) *</div>'}`:''}
    ${i.manual?`<label class="fl" style="margin-top:8px"><span>ID de variación (opcional)</span><input data-ci="${k}" data-f="variation_id" value="${esc(i.variation_id)}" inputmode="numeric" style="width:140px"></label>`:''}</div></div>
   <label class="fl" style="margin:0"><span>Cantidad</span><input type="number" min="1" max="50" step="1" value="${esc(i.qty)}" data-ci="${k}" data-f="qty" style="width:80px"></label>
   <label class="fl" style="margin:0"><span class="req">Precio de venta (MXN)</span><input type="number" min="0" step="0.01" value="${esc(i.price)}" data-ci="${k}" data-f="price" style="width:130px"></label>
   <b class="tot" style="min-width:90px;text-align:right;align-self:center">${mx((Number(i.price)||0)*(Number(i.qty)||0))}</b><button type="button" class="ic" style="background:var(--card2);border:1px solid var(--line);align-self:center" data-cx="${k}" title="Quitar">${I('x')}</button></div>`}).join('')||'<div class="empty">Agregue productos desde el catálogo, sus favoritos o por ID.</div>';
  el.querySelectorAll('[data-ci]').forEach(i=>{const h=()=>{NP.items[i.dataset.ci][i.dataset.f]=i.value;npSum();const t=i.closest('.frow').querySelector('b.tot');if(t){const it=NP.items[i.dataset.ci];t.textContent=mx((Number(it.price)||0)*(Number(it.qty)||0))}};i.oninput=h;i.onchange=h});
  el.querySelectorAll('[data-vk]').forEach(b=>b.onclick=()=>{const it=NP.items[b.dataset.vk],v=it.variations.find(x=>String(x.id)===b.dataset.vv);if(!v)return;
    const prev=it.suggested;it.variation_id=v.id;if(v.suggested>0){if(it.price===''||Number(it.price)===Number(prev))it.price=v.suggested;it.suggested=v.suggested}npCart();npSum()});
  el.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{NP.items.splice(b.dataset.cx,1);npCart();npSum()})}
async function npEnviar(forzar){
  const b=$('npgo');b.disabled=true;b.innerHTML='Enviando…';
  const body={...Object.fromEntries(['name','surname','phone','client_email','dni','state','city','colonia','zip_code','dir','rate_type','distribution_company_id','shop_order_id','shop_order_number','notes'].map(k=>[k,NP[k]])),
    products:NP.items.map(i=>{const v=i.variations.find(x=>String(x.id)===String(i.variation_id));return {id:i.id,name:i.name+(v?' ('+v.label+')':''),price:Number(i.price),quantity:Number(i.qty),variation_id:i.variation_id||null}}),forzar};
  try{const r=await post('crear',body);NP.res=r.orden;nuevo()}
  catch(e){
    if(e.data&&e.data.duplicado&&!forzar&&confirm(e.message+'\n\n¿Enviarlo de todos modos?'))return npEnviar(true);
    b.disabled=false;b.innerHTML=I('send')+' Subir pedido a Dropi';$('nperr').innerHTML=`<div class="err" style="margin-top:10px">${esc(e.message)}</div>`}}
function npAddProd(p,nota){
  const ex=NP.items.find(i=>i.id===p.id&&!p.variations.length&&!p.manual);
  if(ex)ex.qty=Number(ex.qty)+1;else NP.items.push({id:p.id,name:p.name,img:p.img||'',price:p.suggested||p.price||'',suggested:p.suggested||0,qty:1,variations:p.variations||[],variation_id:'',manual:!!p.manual});
  npCart();npSum();const m=$('pm-msg');if(m)m.textContent=nota||('Agregado: '+p.name)}
async function npResolveId(id,name){
  const m=$('pm-msg');if(m)m.textContent='Buscando el producto '+id+'…';
  try{const r=await api('productos',{id:String(id)});
    if(r.productos.length)npAddProd(r.productos[0],'Agregado: '+r.productos[0].name+' (ID '+id+')');
    else npAddProd({id:Number(id),name:name||('Producto ID '+id),suggested:0,variations:[],manual:true},'El ID '+id+' no apareció en el catálogo: se agregó tal cual. Escriba el precio y, si es variable, el ID de la variación.')}
  catch(e){if(m)m.innerHTML=`<span class="neg">${esc(e.message)}</span>`}}
function pmodeDraw(){
  const el=$('pmode');if(!el)return;const fl=favList();
  el.innerHTML=`<div class="row" id="pm-ch">${[['cat','Catálogo'],['fav','Favoritos ('+fl.length+')'],['id','Por ID']].map(([k,l])=>`<button type="button" class="fchip ${NP.pm===k?'on':''}" data-pm="${k}">${l}</button>`).join('')}</div><div id="pm-body" style="margin-top:12px"></div><div id="pm-msg" class="mut" style="margin-top:8px;font-size:12px"></div>`;
  $('pm-ch').onclick=e=>{const b=e.target.closest('[data-pm]');if(b){NP.pm=b.dataset.pm;pmodeDraw()}};
  const body=$('pm-body');
  if(NP.pm==='cat'){
    body.innerHTML=`<div class="row"><input id="ps" placeholder="Buscar producto del catálogo de Dropi…" style="flex:1;min-width:200px"><button type="button" class="btn pri" id="psb">Buscar</button></div><div id="pres" style="margin-top:10px"></div>`;
    const buscar=async()=>{const q=$('ps').value.trim(),o=$('pres');if(!q)return;o.innerHTML='<div class="mut">Buscando…</div>';
      try{const r=await api('productos',{q});window.__res=r.productos;o.innerHTML=r.productos.map((p,k)=>`<div class="frow">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:42px;height:42px;object-fit:cover;border-radius:9px;border:1px solid var(--line)" onerror="this.remove()">`:''}<div style="flex:1"><div class="nm">${esc(p.name)}</div><div class="sb">ID ${esc(p.id)} · sugerido ${mx(p.suggested)}${p.variations.length?' · '+p.variations.length+' variaciones ':''}${p.variations.slice(0,10).map(v=>{const w=swatch(v.color||v.label);return w?`<i class="sw sm" style="background:${w}" title="${esc(v.label)}"></i>`:''}).join('')}</div></div><button type="button" class="btn sm" data-add="${k}">+ Agregar</button></div>`).join('')||'<div class="mut">Sin resultados</div>';
        o.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>npAddProd(window.__res[b.dataset.add]))}
      catch(e){o.innerHTML=`<div class="err">${esc(e.message)}</div>`}};
    $('psb').onclick=buscar;$('ps').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();buscar()}};
    if(NP.q){$('ps').value=NP.q;NP.q='';buscar()}
  }else if(NP.pm==='fav'){
    body.innerHTML=`<input id="fs" placeholder="Buscar en favoritos…" value="${esc(NP.fs)}" style="width:100%;margin-bottom:8px"><div id="fl2"></div><p class="mut" style="font-size:12px;margin:8px 0 0">Los favoritos con ID se agregan directo; los que no tienen ID se buscan por nombre en el catálogo. Administre sus favoritos en la pestaña Proveedores.</p>`;
    const draw=()=>{const q=NP.fs.toLowerCase(),r=fl.filter(f=>!q||(f.name+' '+f.prov).toLowerCase().includes(q));
      $('fl2').innerHTML=r.map(f=>`<div class="frow"><div style="flex:1"><div class="nm">${f.star?I('star')+' ':''}${esc(f.name)}</div><div class="sb">${esc(f.prov||'Sin proveedor')} · ${f.id?'ID '+esc(f.id):'sin ID (se buscará en el catálogo)'}</div></div><button type="button" class="btn sm" data-fa="${fl.indexOf(f)}">+ Agregar</button></div>`).join('')||'<div class="empty">Sin favoritos todavía.</div>';
      $('fl2').querySelectorAll('[data-fa]').forEach(b=>b.onclick=()=>{const f=fl[b.dataset.fa];if(f.id)npResolveId(f.id,f.name);else{NP.pm='cat';NP.q=f.name;pmodeDraw()}})};
    $('fs').oninput=e=>{NP.fs=e.target.value;draw()};draw();
  }else{
    body.innerHTML=`<div class="row"><input id="pidv" type="number" min="1" step="1" placeholder="ID del producto en Dropi" style="flex:1;min-width:200px"><button type="button" class="btn pri" id="pidb">Agregar por ID</button></div><p class="mut" style="font-size:12px;margin:8px 0 0">Escriba el ID tal como aparece en Dropi. Si está en el catálogo se completan el nombre, el precio sugerido y las variaciones.</p>`;
    const go=()=>{const v=$('pidv').value.trim();if(!/^\d+$/.test(v)||Number(v)<1){$('pm-msg').innerHTML='<span class="neg">Escriba un ID numérico</span>';return}npResolveId(Number(v));$('pidv').value=''};
    $('pidb').onclick=go;$('pidv').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
  }
}
function dcDraw(){
  const w=$('dcwrap');if(!w)return;const cur=String(NP.distribution_company_id||''),otra=NP.dcotra||(cur&&!CAR.some(c=>String(c.id)===cur));
  w.innerHTML=`<label class="fl"><span>Transportadora</span><select id="dcsel"><option value="">Automática (Dropi elige)</option>${CAR.map(c=>`<option value="${esc(c.id)}" ${cur===String(c.id)?'selected':''}>${esc(c.name)} · ID ${esc(c.id)} · ${c.n} pedido${c.n>1?'s':''}</option>`).join('')}<option value="__otra" ${otra?'selected':''}>Otra… (escribir ID)</option></select></label>${otra?`<label class="fl"><span>ID de la transportadora</span><input id="dcman" inputmode="numeric" maxlength="6" value="${esc(cur)}" placeholder="Ej: 6"></label>`:''}`;
  $('dcsel').onchange=e=>{const v=e.target.value;if(v==='__otra'){NP.dcotra=true;NP.distribution_company_id=''}else{NP.dcotra=false;NP.distribution_company_id=v}dcDraw();npSum()};
  const m=$('dcman');if(m)m.oninput=e=>{NP.distribution_company_id=e.target.value.replace(/\D/g,'');npSum()}}
async function nuevo(){
  await loadFav();try{CAR=(await api('transportadoras')).transportadoras}catch(e){CAR=[]}let hist=[],demo=false;try{const h=await api('crear');hist=h.ordenes;demo=h.demo}catch(e){}
  const histHTML=`<div class="card flat sec"><div class="hd"><h3>${I('clock')} Pedidos subidos desde VELTRIX</h3><span class="sp"></span><small>${hist.length} registros · sin datos del cliente</small></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>ID Dropi</th><th>Estado</th><th>Productos</th><th>Total estimado</th><th>Pago</th><th>Resultado</th></tr></thead><tbody>
   ${hist.map(h=>`<tr><td>${esc(h.fecha)}</td><td><span class="mono">${esc(h.id||'—')}</span></td><td>${esc(h.estado)}</td><td style="white-space:normal">${h.items.map(i=>esc(i.q+'× '+i.n)).join(', ')}</td><td>${mx(h.total)} <span class="mut">≈ ${penTxt(h.total)}</span></td><td>${h.rate==='CON RECAUDO'?'Contra entrega':'Prepagado'}</td>
   <td>${h.demo?'<span class="chip">SIMULADO</span>':h.status==='creado'?'<span class="chip g">Creado</span>':h.status==='incierto'?'<span class="chip a">Verificar en Dropi</span>':'<span class="chip b">Enviando…</span>'}</td></tr>`).join('')||'<tr><td colspan=7 class="empty">Todavía no ha subido pedidos desde aquí</td></tr>'}</tbody></table></div></div>`;
  if(NP&&NP.res){const r=NP.res;
    view.innerHTML=`<div class="card flat" style="text-align:center;padding:30px"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">${r.demo?'Pedido simulado':'Pedido creado en Dropi'}</h2>
     <p class="mut">${r.demo?'Modo demostración: <b>no se envió nada</b> a Dropi.':'Dropi lo registró y la transportadora lo recogerá según su proceso.'}</p><p>ID: <span class="chip b mono" style="font-size:14px">${esc(r.id||'sin id devuelto')}</span> · Total estimado ${mx(r.total)} (≈ ${penTxt(r.total)}) + flete</p>
     <p style="margin-top:16px"><button class="btn pri" id="npnew">Subir otro pedido</button></p></div>${histHTML}${foot(0,Date.now())}`;
    $('npnew').onclick=()=>{NP=npNew();nuevo()};return}
  if(!NP)NP=npNew();
  const T=(k,l,o={})=>`<label class="fl"><span class="${o.req?'req':''}">${l}</span><input data-k="${k}" value="${esc(NP[k])}" ${o.type?`type="${o.type}"`:''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.max?`maxlength="${o.max}"`:''} ${o.list?`list="${o.list}"`:''} ${o.mode?`inputmode="${o.mode}"`:''} autocomplete="off"></label>`;
  view.innerHTML=`${demo?'<div class="err" style="background:var(--p-nov);color:var(--p-novt)">Modo demostración: esta cuenta no tiene token, los pedidos se <b>simulan</b> y no se envían a Dropi.</div>':''}
  <div class="ofgrid"><div>
   <div class="card flat"><div class="hd"><h3>${I('wallet')} 1 · Cliente</h3></div><div class="fg">${T('name','Nombre',{req:1,max:60})}${T('surname','Apellido',{req:1,max:60})}${T('phone','Teléfono (10 dígitos)',{req:1,max:20,mode:'tel',ph:'55 1234 5678'})}${T('client_email','Correo (opcional)',{type:'email',max:100})}${T('dni','Documento (opcional)',{max:30})}</div></div>
   <div class="card flat sec"><div class="hd"><h3>${I('building')} 2 · Entrega</h3></div><datalist id="dl-est">${MX_ESTADOS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <div class="fg">${T('state','Estado',{req:1,list:'dl-est',max:60})}${T('city','Ciudad / municipio / alcaldía',{req:1,max:80})}${T('colonia','Colonia (opcional)',{max:80})}${T('zip_code','Código postal (5 dígitos)',{req:1,max:5,mode:'numeric',ph:'44100'})}</div>
    <label class="fl" style="margin-top:12px"><span class="req">Dirección (calle, número, referencias)</span><textarea data-k="dir" rows="2" maxlength="200">${esc(NP.dir)}</textarea></label></div>
   <div class="card flat sec"><div class="hd"><h3>${I('star')} 3 · Productos</h3></div><div id="pmode"></div>
    <div class="gl">EN EL PEDIDO</div><div id="cart"></div></div>
   <div class="card flat sec"><div class="hd"><h3>${I('truck')} 4 · Pago y envío</h3></div><div class="fg">
    <label class="fl"><span class="req">Tipo de pago</span><select data-k="rate_type"><option value="CON RECAUDO" ${NP.rate_type==='CON RECAUDO'?'selected':''}>Contra entrega (con recaudo)</option><option value="SIN RECAUDO" ${NP.rate_type==='SIN RECAUDO'?'selected':''}>Prepagado (sin recaudo)</option></select></label>
    <div id="dcwrap"></div>${T('shop_order_id','ID de pedido de tu tienda (opcional)',{max:60})}${T('shop_order_number','N.º de pedido de tu tienda (opcional)',{max:60})}</div>
    <label class="fl" style="margin-top:12px"><span>Notas internas (opcional)</span><textarea data-k="notes" rows="2" maxlength="300">${esc(NP.notes)}</textarea></label></div>
  </div><div class="card flat" style="position:sticky;top:70px"><h3 style="margin-bottom:8px">Resumen</h3><div id="npsum"></div></div></div>${histHTML}`;
  view.querySelectorAll('[data-k]').forEach(i=>{const h=()=>{NP[i.dataset.k]=i.value;npSum()};i.oninput=h;i.onchange=h});
  dcDraw();pmodeDraw();npCart();npSum();
}

addEventListener('storage',ev=>{if(ev.key==='vx_mode'||ev.key==='vx_pen'){srcTxt();render()}});
load();
</script></body></html>
